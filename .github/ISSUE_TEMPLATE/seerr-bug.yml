name: "Seerr Companion: bug report"
description: Something in Seerr Companion does not work as it should.
labels: ["bug", "app: seerr"]
body:
  - type: markdown
    attributes:
      value: |
        The app fills in the version and device fields when you report from it.
        This issue is public. Do not include your server's address, your API key or anyone's name.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Tap …
  - type: input
    id: server
    attributes:
      label: Server
      description: Seerr, Jellyseerr or Overseerr, and its version.
      placeholder: Seerr 3.5.1
  - type: input
    id: app-version
    attributes:
      label: App version
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
  - type: input
    id: android-version
    attributes:
      label: Android version
