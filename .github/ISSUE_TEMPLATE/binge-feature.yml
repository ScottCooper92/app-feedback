name: "Binge: feature request"
description: Suggest an idea or improvement for Binge.
labels: ["enhancement", "app: binge"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that Binge makes hard today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like Binge to do?
    validations:
      required: true
